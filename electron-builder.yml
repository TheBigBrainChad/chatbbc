# ChatBBC ships exactly one supported distribution: a Linux x64 AppImage built on a Linux x64 host.
# scripts/package.mjs refuses any other host/target before a build step runs, so no win/mac/arm
# builder configuration lives here to imply a supported artifact that would never be verified.
appId: com.chatbbc.app
productName: ChatBBC
copyright: MIT licensed

directories:
  output: release
  buildResources: build

# Only built output + runtime dependencies ship. Platform-specific native prebuilds are narrowed
# again in the linux section so a package never carries another OS/CPU's executable payload.
files:
  - out/**
  - package.json
  - '!node_modules/@img/sharp-*/**/*'
  - '!node_modules/@img/sharp-libvips-*/**/*'
  - '!node_modules/@koromix/koffi-*/**/*'
  - '!node_modules/koffi/build/**/*'
  # PDF.js is bundled into the renderer (including its worker). Its optional @napi-rs/canvas
  # dependency is a Node-only fallback and is neither imported nor needed by the Electron UI.
  - '!node_modules/pdfjs-dist/**/*'
  - '!node_modules/@napi-rs/canvas/**/*'
  - '!node_modules/@napi-rs/canvas-*/**/*'
  # node-pty prefers build/Release over prebuilds. npm may leave a host-native build there,
  # which would silently override the target prebuild in the package.
  - '!node_modules/node-pty/build/**/*'
  - '!node_modules/node-pty/third_party/**/*'
  - '!node_modules/node-pty/prebuilds/**/*'
  - '!node_modules/tree-sitter/prebuilds/**/*'
  - '!node_modules/tree-sitter-bash/prebuilds/**/*'

# Common real-filesystem resources. The tunnel/ripgrep binaries and their per-component notices are
# appended below because their filenames and executable formats are target-specific.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  - from: pets
    to: pets
    filter:
      - '*/pet.json'
      - '*/atlas.png'
      - '*/animations.json'
  # The companion extension ships inside the app so "reveal the companion folder" points at a
  # loadable tree rather than a copy staged by another product's install.
  - from: extension
    to: extension
    filter:
      - '**/*'
      - '!**/*.map'

npmRebuild: false

asarUnpack:
  - '**/node_modules/@koromix/koffi-*/**'
  - '**/node_modules/node-pty/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/tree-sitter/**'
  - '**/node_modules/tree-sitter-bash/**'
compression: maximum

# electron-builder 26 defaults to the legacy FUSE2 AppImage runtime. Ubuntu 24.04 renamed
# libfuse2 to libfuse2t64 and does not install it by default, so use builder's static runtime
# toolset instead. This keeps the standalone AppImage actually portable on the release target.
toolsets:
  appimage: "1.0.3"

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development
  executableName: chatbbc
  maintainer: TheBigBrainChad <TheBigBrainChad@users.noreply.github.com>
  # package.json desktopName + syncDesktopName produce com.chatbbc.app.desktop with
  # StartupWMClass=com.chatbbc.app, matching Electron's app_id and WM_CLASS.
  syncDesktopName: true
  # One architecture is supported, so the public name is fixed instead of derived from the build
  # architecture. Keep it identical to the update feed's staged artifact name.
  artifactName: ChatBBC-Linux-x64.AppImage
  files:
    - from: resources/packaging/native/linux/${arch}/node_modules
      to: node_modules
      filter: ['**/*']
  extraResources:
    - from: build/runtime-icon.png
      to: runtime-icon.png
    - from: resources/packaging/native/linux/${arch}/node_modules/@img/sharp-wasm32/README.md
      to: THIRD-PARTY-NOTICES-sharp-wasm32.md
    - from: resources/packaging/tunnel/linux/${arch}
      to: tunnel
      filter: ['**/*']
    - from: resources/packaging/rg/linux/${arch}
      to: rg
      filter: ['**/*']
